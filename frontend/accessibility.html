<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessibility - Inclusive AI Learning</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Top Navigation Bar -->
  <header class="header">
    <div class="header-content">
      <div class="nav-section">
        <h1 class="app-name">Inclusive AI Learning</h1>
        <nav class="nav-menu">
          <a href="home.html" class="nav-item">Home</a>
          <a href="dashboard.html" class="nav-item">Dashboard</a>
          <a href="lessons.html" class="nav-item">Lessons</a>
          <a href="ai-tutor.html" class="nav-item">AI Tutor</a>
          <a href="accessibility.html" class="nav-item active">Accessibility</a>
          <a href="support.html" class="nav-item">Support</a>
          <a href="settings.html" class="nav-item">Settings</a>
        </nav>
      </div>
      <div class="user-menu">
        <div class="user-icon" id="userIcon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="8" r="4"></circle>
            <path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"></path>
          </svg>
        </div>
        <div class="user-panel" id="userPanel">
          <div class="panel-item user-info">
            <div class="info-label">Name</div>
            <div class="info-value" id="panelUserName">User</div>
          </div>
          <div class="panel-item user-info" id="emailInfo">
            <div class="info-label">Email</div>
            <div class="info-value" id="panelUserEmail">-</div>
          </div>
          <div class="panel-item user-info">
            <div class="info-label">Role</div>
            <div class="info-value">Student</div>
          </div>
          <div class="panel-divider"></div>
          <div class="panel-item panel-action" onclick="logout()">
            Logout
          </div>
        </div>
      </div>
    </div>
  </header>
  <main class="main-content">
    <section class="section" id="accessibilitySection">
      <h3>Accessibility Settings</h3>
      <p>Choose your preferred learning mode:</p>
      <div class="accessibility-options">
        <label class="radio-option">
          <input type="radio" name="mode" value="normal" checked onchange="setMode('normal')">
          <span>Normal Mode - Standard text and audio</span>
        </label>
        <label class="radio-option">
          <input type="radio" name="mode" value="deaf" onchange="setMode('deaf')">
          <span>Deaf Mode - Enhanced visual + sign language</span>
        </label>
        <label class="radio-option">
          <input type="radio" name="mode" value="speech" onchange="setMode('speech')">
          <span>Speech-Impaired Mode - Voice recognition + text input</span>
        </label>
      </div>
      <p class="current-mode">Current Mode: <strong id="currentModeText">Normal Mode</strong></p>
    </section>
  </main>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
