<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Edu-AI</title>

    <!-- Fast redirect for servers that honor index.html -->
    <meta http-equiv="refresh" content="0; url=home.html" />

    <link rel="manifest" href="manifest.json" />

    <script>
      // JS redirect fallback (and keeps URL relative to current base)
      (function () {
        try {
          var target = "home.html";
          if (!location.pathname.endsWith("/" + target)) {
            location.replace(target);
          }
        } catch (e) {
          // ignore
        }
      })();
    </script>

    <noscript>
      <meta http-equiv="refresh" content="0; url=home.html" />
    </noscript>

    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; padding: 24px; }
      a { color: #2563eb; }
    </style>
  </head>
  <body>
    Redirecting… If you are not redirected, open <a href="home.html">home.html</a>.
  </body>
</html>
