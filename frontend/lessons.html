<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lessons - Inclusive AI Learning</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Top Navigation Bar -->
  <header class="header">
    <div class="header-content">
      <div class="nav-section">
        <h1 class="app-name">Inclusive AI Learning</h1>
        <nav class="nav-menu">
          <a href="home.html" class="nav-item">Home</a>
          <a href="dashboard.html" class="nav-item">Dashboard</a>
          <a href="lessons.html" class="nav-item active">Lessons</a>
          <a href="ai-tutor.html" class="nav-item">AI Tutor</a>
          <a href="accessibility.html" class="nav-item">Accessibility</a>
          <a href="support.html" class="nav-item">Support</a>
          <a href="settings.html" class="nav-item">Settings</a>
        </nav>
        </div>
          <div class="auth-actions" aria-label="Authentication">
            <a href="login.html" class="button btn-small auth-link">Login</a>
            <a href="register.html" class="button btn-secondary btn-small auth-link">Sign Up</a>
          </div>
      </div>
      <div class="user-menu">
        <div class="user-icon" id="userIcon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="8" r="4"></circle>
            <path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"></path>
          </svg>
        </div>
        <div class="user-panel" id="userPanel">
          <div class="panel-item user-info">
            <div class="info-label">Name</div>
            <div class="info-value" id="panelUserName">User</div>
          </div>
          <div class="panel-item user-info" id="emailInfo">
            <div class="info-label">Email</div>
            <div class="info-value" id="panelUserEmail">-</div>
          </div>
          <div class="panel-item user-info">
            <div class="info-label">Role</div>
            <div class="info-value">Student</div>
          </div>
          <div class="panel-divider"></div>
          <div class="panel-item panel-action" onclick="logout()">
            Logout
          </div>
        </div>
      </div>
    </div>
  </header>
  <main class="main-content">
    <section class="section" id="videoExplainerSection">
      <h3>Video Lesson Explainer</h3>
      <p class="section-note">Paste a YouTube link, watch the video, and get a simple AI explanation.</p>
      <div class="video-explainer-grid">
        <div class="video-explainer-inputs">
          <label for="youtubeUrlInput">YouTube URL</label>
          <input type="url" id="youtubeUrlInput" class="ai-tutor-input" placeholder="https://www.youtube.com/watch?v=..." maxlength="500">
          <button class="button btn-small" id="loadVideoBtn">Load Video</button>
          <label for="videoQuestionInput">Ask about this video (optional)</label>
          <input type="text" id="videoQuestionInput" class="ai-tutor-input" placeholder="What should I focus on?" maxlength="500">
          <label for="manualTranscriptInput">Paste transcript (optional, for blocked videos)</label>
          <textarea id="manualTranscriptInput" class="ai-tutor-input video-transcript-input" placeholder="Paste captions here if YouTube transcript is unavailable." maxlength="8000"></textarea>
          <button class="button" id="explainVideoBtn">Explain this video</button>
          <div id="videoExplainerStatus" class="ai-tutor-response" aria-live="polite"></div>
        </div>
        <div class="video-explainer-player">
          <div class="video-embed" id="videoEmbedContainer">
            <div class="video-embed-placeholder" id="videoEmbedPlaceholder">Video preview will appear here.</div>
            <iframe id="videoEmbed" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
          </div>
          <div class="video-explainer-output" id="videoExplainerOutput"></div>
        </div>
      </div>
    </section>
  </main>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="voice.js"></script>
</body>
</html>
