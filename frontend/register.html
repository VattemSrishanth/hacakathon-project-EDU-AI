<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Registration page for Inclusive AI Learning platform">
    <title>Register - Inclusive AI Learning</title>
    <style>
        /* Reset and base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            line-height: 1.6;
        }

        /* Container for the registration form */
        .register-container {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 420px;
            padding: 40px;
            animation: fadeIn 0.5s ease-in;
        }

        /* Fade-in animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Application title */
        .app-title {
            text-align: center;
            color: #333333;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        /* Subtitle text */
        .app-subtitle {
            text-align: center;
            color: #666666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* Form group container for each input field */
        .form-group {
            margin-bottom: 20px;
        }

        /* Label styling for input fields */
        label {
            display: block;
            color: #333333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        /* Input field styling */
        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            background-color: #ffffff;
            color: #333333;
        }

        /* Input field focus state */
        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        /* Input field hover state */
        input[type="text"]:hover,
        input[type="email"]:hover,
        input[type="password"]:hover {
            border-color: #999999;
        }

        /* Input field error state */
        input.error {
            border-color: #dc3545;
        }

        input.error:focus {
            box-shadow: 0 0 0 3px rgba(220, 53, 69, 0.1);
        }

        /* Error message styling */
        .error-message {
            color: #dc3545;
            font-size: 13px;
            margin-top: 6px;
            display: none;
            font-weight: 500;
        }

        /* Show error message when validation fails */
        .error-message.show {
            display: block;
        }

        /* Register button styling */
        .register-button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        /* Register button hover effect */
        .register-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        /* Register button active state */
        .register-button:active {
            transform: translateY(0);
        }

        /* Register button focus state for keyboard navigation */
        .register-button:focus {
            outline: 3px solid #667eea;
            outline-offset: 2px;
        }

        /* Login link styling */
        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #666666;
            font-size: 14px;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .login-link a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        .login-link a:focus {
            outline: 2px solid #667eea;
            outline-offset: 2px;
            border-radius: 2px;
        }

        /* Success message styling */
        .success-message {
            background-color: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            border: 1px solid #c3e6cb;
            text-align: center;
        }

        .success-message.show {
            display: block;
        }

        /* Responsive Design - Mobile phones */
        @media (max-width: 480px) {
            .register-container {
                padding: 30px 25px;
            }

            .app-title {
                font-size: 24px;
            }

            input[type="text"],
            input[type="email"],
            input[type="password"],
            .register-button {
                font-size: 14px;
            }
        }

        /* Responsive Design - Very small devices */
        @media (max-width: 360px) {
            .register-container {
                padding: 25px 20px;
            }

            .app-title {
                font-size: 22px;
            }
        }

        /* High Contrast Mode Support for accessibility */
        @media (prefers-contrast: high) {
            body {
                background: #000000;
            }

            .register-container {
                border: 3px solid #ffffff;
            }

            input[type="text"],
            input[type="email"],
            input[type="password"] {
                border-width: 3px;
            }
        }

        /* Focus visible for better keyboard navigation */
        *:focus-visible {
            outline: 3px solid #667eea;
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <div class="register-container" role="main">
        <!-- Application title -->
        <h1 class="app-title">Inclusive AI Learning</h1>
        <p class="app-subtitle">Create your account to start learning</p>

        <!-- Success message (hidden by default) -->
        <div id="successMessage" class="success-message" role="alert" aria-live="polite"></div>

        <!-- Registration form -->
        <form id="registerForm" novalidate aria-label="Registration form">
            <!-- Full Name input -->
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input 
                    type="text" 
                    id="fullName" 
                    name="fullName" 
                    autocomplete="name"
                    aria-required="true"
                    aria-describedby="nameError"
                    placeholder="Enter your full name"
                    required
                >
                <div id="nameError" class="error-message" role="alert" aria-live="polite"></div>
            </div>

            <!-- Email input -->
            <div class="form-group">
                <label for="email">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    autocomplete="email"
                    aria-required="true"
                    aria-describedby="emailError"
                    placeholder="Enter your email"
                    required
                >
                <div id="emailError" class="error-message" role="alert" aria-live="polite"></div>
            </div>

            <!-- Password input -->
            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    autocomplete="new-password"
                    aria-required="true"
                    aria-describedby="passwordError"
                    placeholder="Enter your password (min 6 characters)"
                    required
                >
                <div id="passwordError" class="error-message" role="alert" aria-live="polite"></div>
            </div>

            <!-- Confirm Password input -->
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input 
                    type="password" 
                    id="confirmPassword" 
                    name="confirmPassword" 
                    autocomplete="new-password"
                    aria-required="true"
                    aria-describedby="confirmPasswordError"
                    placeholder="Re-enter your password"
                    required
                >
                <div id="confirmPasswordError" class="error-message" role="alert" aria-live="polite"></div>
            </div>

            <!-- Register button -->
            <button type="submit" class="register-button" aria-label="Create your account">
                Register
            </button>
        </form>

        <!-- Login link for existing users -->
        <div class="login-link">
            <p>Already have an account? <a href="login.html" id="loginLink" aria-label="Go to login page">Login here</a></p>
        </div>
    </div>

    <script>
        // Get all form elements
        const registerForm = document.getElementById('registerForm');
        const fullNameInput = document.getElementById('fullName');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const successMessage = document.getElementById('successMessage');
        
        // Get all error message elements
        const nameError = document.getElementById('nameError');
        const emailError = document.getElementById('emailError');
        const passwordError = document.getElementById('passwordError');
        const confirmPasswordError = document.getElementById('confirmPasswordError');

        // Email validation regex pattern
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        /**
         * Function to show error message below input field
         * @param {HTMLElement} input - The input field element
         * @param {HTMLElement} errorElement - The error message element
         * @param {string} message - The error message to display
         */
        function showError(input, errorElement, message) {
            input.classList.add('error');
            errorElement.textContent = message;
            errorElement.classList.add('show');
            input.setAttribute('aria-invalid', 'true');
        }

        /**
         * Function to clear error message from input field
         * @param {HTMLElement} input - The input field element
         * @param {HTMLElement} errorElement - The error message element
         */
        function clearError(input, errorElement) {
            input.classList.remove('error');
            errorElement.textContent = '';
            errorElement.classList.remove('show');
            input.setAttribute('aria-invalid', 'false');
        }

        /**
         * Validate full name input
         * @returns {boolean} - True if valid, false otherwise
         */
        function validateFullName() {
            const nameValue = fullNameInput.value.trim();
            
            if (nameValue === '') {
                showError(fullNameInput, nameError, 'Full name is required');
                return false;
            } else if (nameValue.length < 2) {
                showError(fullNameInput, nameError, 'Name must be at least 2 characters long');
                return false;
            } else {
                clearError(fullNameInput, nameError);
                return true;
            }
        }

        /**
         * Validate email input
         * @returns {boolean} - True if valid, false otherwise
         */
        function validateEmail() {
            const emailValue = emailInput.value.trim();
            
            if (emailValue === '') {
                showError(emailInput, emailError, 'Email address is required');
                return false;
            } else if (!emailRegex.test(emailValue)) {
                showError(emailInput, emailError, 'Please enter a valid email address');
                return false;
            } else {
                clearError(emailInput, emailError);
                return true;
            }
        }

        /**
         * Validate password input
         * @returns {boolean} - True if valid, false otherwise
         */
        function validatePassword() {
            const passwordValue = passwordInput.value;
            
            if (passwordValue === '') {
                showError(passwordInput, passwordError, 'Password is required');
                return false;
            } else if (passwordValue.length < 6) {
                showError(passwordInput, passwordError, 'Password must be at least 6 characters long');
                return false;
            } else {
                clearError(passwordInput, passwordError);
                return true;
            }
        }

        /**
         * Validate confirm password input
         * @returns {boolean} - True if valid, false otherwise
         */
        function validateConfirmPassword() {
            const confirmPasswordValue = confirmPasswordInput.value;
            const passwordValue = passwordInput.value;
            
            if (confirmPasswordValue === '') {
                showError(confirmPasswordInput, confirmPasswordError, 'Please confirm your password');
                return false;
            } else if (confirmPasswordValue !== passwordValue) {
                showError(confirmPasswordInput, confirmPasswordError, 'Passwords do not match');
                return false;
            } else {
                clearError(confirmPasswordInput, confirmPasswordError);
                return true;
            }
        }

        // Clear errors when user starts typing in full name field
        fullNameInput.addEventListener('input', function() {
            if (this.classList.contains('error')) {
                clearError(fullNameInput, nameError);
            }
        });

        // Clear errors when user starts typing in email field
        emailInput.addEventListener('input', function() {
            if (this.classList.contains('error')) {
                clearError(emailInput, emailError);
            }
        });

        // Clear errors when user starts typing in password field
        passwordInput.addEventListener('input', function() {
            if (this.classList.contains('error')) {
                clearError(passwordInput, passwordError);
            }
            // Also revalidate confirm password if it has been filled
            if (confirmPasswordInput.value !== '' && confirmPasswordInput.classList.contains('error')) {
                validateConfirmPassword();
            }
        });

        // Clear errors when user starts typing in confirm password field
        confirmPasswordInput.addEventListener('input', function() {
            if (this.classList.contains('error')) {
                clearError(confirmPasswordInput, confirmPasswordError);
            }
        });

        /**
         * Handle form submission
         * This prevents page reload and validates all inputs
         */
        registerForm.addEventListener('submit', function(e) {
            // Prevent the default form submission behavior (page reload)
            e.preventDefault();

            // Validate all fields
            const isNameValid = validateFullName();
            const isEmailValid = validateEmail();
            const isPasswordValid = validatePassword();
            const isConfirmPasswordValid = validateConfirmPassword();

            // If all validations pass, proceed with registration
            if (isNameValid && isEmailValid && isPasswordValid && isConfirmPasswordValid) {
                // Get the form values
                const userData = {
                    fullName: fullNameInput.value.trim(),
                    email: emailInput.value.trim(),
                    registrationDate: new Date().toISOString()
                };

                // Store user data in localStorage
                // Note: In a real application, you would send this to a server
                localStorage.setItem('userEmail', userData.email);
                localStorage.setItem('userFullName', userData.fullName);
                localStorage.setItem('registrationDate', userData.registrationDate);

                // Show success message
                successMessage.textContent = 'Registration successful! Redirecting to login...';
                successMessage.classList.add('show');

                // Redirect to login page after 2 seconds
                setTimeout(function() {
                    window.location.href = 'login.html';
                }, 2000);
            }
        });

        /**
         * Improve keyboard navigation
         * Press Enter on any field except the last one to move to the next field
         */
        fullNameInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                emailInput.focus();
            }
        });

        emailInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                passwordInput.focus();
            }
        });

        passwordInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                confirmPasswordInput.focus();
            }
        });

        // Auto-focus on full name field when page loads
        window.addEventListener('load', function() {
            fullNameInput.focus();
        });
    </script>
    <script src="voice.js"></script>
</body>
</html>
