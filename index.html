<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Edu-AI</title>

    <!-- Root entry point: redirect into the frontend folder -->
    <meta http-equiv="refresh" content="0; url=frontend/home.html" />

    <script>
      (function () {
        try {
          var target = "frontend/home.html";
          if (!location.pathname.endsWith("/" + target)) {
            location.replace(target);
          }
        } catch (e) {
          // ignore
        }
      })();
    </script>

    <noscript>
      <meta http-equiv="refresh" content="0; url=frontend/home.html" />
    </noscript>

    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; padding: 24px; }
      a { color: #2563eb; }
    </style>
  </head>
  <body>
    Redirecting… If you are not redirected, open <a href="frontend/home.html">frontend/home.html</a>.
  </body>
</html>
